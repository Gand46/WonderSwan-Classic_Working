plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gand46.wonderswanmobile'
    compileSdk 35

    defaultConfig {
        applicationId 'com.gand46.wonderswanmobile'
        minSdk 24
        targetSdk 35
        versionCode 1401
        versionName '1.4.0-android1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
