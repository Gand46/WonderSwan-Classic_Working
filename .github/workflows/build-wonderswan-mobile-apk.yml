name: Build WonderSwan Mobile APK

on:
  push:
    branches:
      - chatgpt/wonderswan-mobile-apk-v1.4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android source archive
        run: |
          cat apk-source-parts/part00.b64 apk-source-parts/part01.b64 apk-source-parts/part02.b64 apk-source-parts/part03.b64 apk-source-parts/part04.b64 | base64 -d > source.zip
          echo "d9dcfe06d58070979758a662ba388c719ab83217c09ef121a4ea55d643409ab2  source.zip" | sha256sum -c -
          unzip -t source.zip
          rm -rf android-build
          mkdir android-build
          unzip -q source.zip -d android-build
          cp -a android-build/WonderSwan_Mobile_Android_v1.4.0/. android-build-root
          rm -rf android-build
          mv android-build-root android-build

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-build
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Validate and prepare artifact
        run: |
          test -s android-build/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android-build/app/build/outputs/apk/debug/app-debug.apk
          cp android-build/app/build/outputs/apk/debug/app-debug.apk WonderSwan_Mobile_Pro_v1.4.0_Android.apk
          sha256sum WonderSwan_Mobile_Pro_v1.4.0_Android.apk > WonderSwan_Mobile_Pro_v1.4.0_Android.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WonderSwan-Mobile-Pro-v1.4.0-Android
          path: |
            WonderSwan_Mobile_Pro_v1.4.0_Android.apk
            WonderSwan_Mobile_Pro_v1.4.0_Android.apk.sha256
          if-no-files-found: error
