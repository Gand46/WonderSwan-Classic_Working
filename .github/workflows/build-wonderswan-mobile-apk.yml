name: Build WonderSwan Mobile APK

on:
  push:
    branches:
      - chatgpt/wonderswan-mobile-apk-v1.4
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android source and normalize Java
        run: |
          cat android-src.b64.part00 android-src.b64.part01 android-src.b64.part02 android-src.b64.part03 android-src.b64.part04 android-src.b64.part05 android-src.b64.part06a android-src.b64.part06b android-src.b64.part07a android-src.b64.part07b > android-src.b64
          base64 -d android-src.b64 > WonderSwan_Mobile_Android_v1.4.0_Source.fixed.zip
          unzip -t WonderSwan_Mobile_Android_v1.4.0_Source.fixed.zip
          rm -rf android-mobile-wrapper
          mkdir android-mobile-wrapper
          unzip -q WonderSwan_Mobile_Android_v1.4.0_Source.fixed.zip -d android-mobile-wrapper
          mv android-mobile-wrapper/WonderSwan_Mobile_Android_v1.4.0/* android-mobile-wrapper/
          rm -rf android-mobile-wrapper/WonderSwan_Mobile_Android_v1.4.0
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android-mobile-wrapper/app/src/main/java/com/gand46/wonderswanmobile/MainActivity.java')
          s=p.read_text()
          s=s.replace('String message = "Blocked remote request: " + scheme;', 'final String message = "Blocked remote request: " + scheme;')
          s=s.replace('WebSettings.AlgorithmicDarkeningAllowed(false);','')
          s=s.replace('settings.setAlgorithmicDarkeningAllowed(false);','')
          s=s.replace('File dir = getExternalFilesDir(null);','File dir = MainActivity.this.getExternalFilesDir(null);')
          p.write_text(s)
          print('Normalized MainActivity.java')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-mobile-wrapper
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          cp android-mobile-wrapper/app/build/outputs/apk/debug/app-debug.apk WonderSwan_Mobile_Pro_v1.4.0_Android.apk
          sha256sum WonderSwan_Mobile_Pro_v1.4.0_Android.apk > WonderSwan_Mobile_Pro_v1.4.0_Android.apk.sha256
          unzip -t WonderSwan_Mobile_Pro_v1.4.0_Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WonderSwan-Mobile-Pro-v1.4.0-Android
          path: |
            WonderSwan_Mobile_Pro_v1.4.0_Android.apk
            WonderSwan_Mobile_Pro_v1.4.0_Android.apk.sha256
          if-no-files-found: error
